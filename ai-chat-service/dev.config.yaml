server:
  ip: 0.0.0.0
  port: 50055
  accessToken: "${AI_CHAT_SERVER_ACCESS_TOKEN}"
  # 健康/指标 HTTP 默认只监听 loopback；跨主机/容器抓取时改为 0.0.0.0:8080，
  # 并用内网策略 + metrics_access_token 限制来源。
  metrics_addr: "127.0.0.1:8080"
  metrics_access_token: "${AI_CHAT_METRICS_TOKEN}"
log:
  # panic,fatal,error,warn,warning,info,debug,trace
  level: "info"
  logPath: "runtime/logs/app.log"
chat:
  # openai key
  api_key: "${AI_CHAT_API_KEY}"
  # openai 接口地址
  base_url: "http://localhost:8084/v1"
  # 使用的训练模型（DeepSeek v4-flash，与用户 key 匹配）
  model: "deepseek-v4-flash"
  # 单次请求的上下文总长度,包括：请求消息+响应消息
  max_tokens: 8192
  # 表示语言模型输出的随机性和创造性
  # 取值范围 0 ~ 1，值越大随机性越高
  temperature: 0.8
  # 用于生成文本时控制选词的随机程度
  # 即下一个预测单词考虑的概率范围
  # 取值范围0 ~ 1
  top_p: 0.9
  # 存在惩罚，用于生成文本时控制重复使用单词的程度
  # 取值范围 0 ~ 1 ，0表示不惩罚，1表示禁止重复
  presence_penalty: 0.8
  # 用于控制模型生成回复时重复单词出现的频率
  # 取值范围 0~1，值越大表示回复时会更注重避免使用已经出现的单词
  frequency_penalty: 0.5
  # AI助手特征描述
  bot_desc: "你是一个AI助手，我需要你模拟一名资深的软件工程师来回答我的问题"
  # 单次请求，保留的响应tokens数量
  min_response_tokens: 2048
  # 上下文缓存时长，单位s
  context_ttl: 1800
  # 上下文消息条数
  context_len: 4
redis:
  host: "127.0.0.1"
  port: 5160
  pwd: ""
mysql:
  dsn: "${AI_CHAT_MYSQL_DSN}"
  maxLifeTime: 3600
  maxOpenConn: 10
  maxIdleConn: 10
# 知识发布 Outbox Worker：DB 提交与 PocketKV 失效解耦，失败按租约重试/进入 dead。
knowledge_outbox:
  enabled: true
  interval_seconds: 5
  batch_size: 20
  max_attempts: 8
  lease_seconds: 60
  cache_ttl_seconds: 86400
dependOn:
  sensitive:
    address: "localhost:50053"
    accessToken: "${AI_CHAT_SENSITIVE_ACCESS_TOKEN}"
  keywords:
    address: "localhost:50054"
    accessToken: "${AI_CHAT_KEYWORDS_ACCESS_TOKEN}"
  tokenizer:
    address: "http://127.0.0.1:3002"
  semantic:
    address: "http://127.0.0.1:3003"
semantic_cache:
  enabled: true
  # Phase-1 阈值（废弃，仅兼容读取，不再参与 e5/批决策链路）：/rerank 已 deprecated 且 score 恒 0
  threshold: 0.35
  rerank_threshold: 0.25
  exact_fingerprint_enabled: true
  top_k: 30
  # e5s:v1 命名空间与 model-info 一致性
  dimension: 384
  vector_namespace: "semd:e5s:v1:"
  embedding_model: "intfloat/multilingual-e5-small"
  embedding_revision: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
  export_version: "onnx-int8-v1"
  # 检索阈值（Task6 校准，见 semantic/tools/calibrate.py 与 module doc）：
  #   e5 绝对余弦跨主题饱和(~0.84-0.9)，decision-ok 真实复用最低 ~0.776。同主题真负均被 decision
  #   先行硬拒 → 无"正/负可分"的绝对余弦。acceptance 仅作极低兜底(0.6)防嵌入事故；真正区分靠 decision。
  #   min_margin 0.0（decision+margin 体系的 margin 待 VSEARCH/Go 阶段验证后上调）。
  acceptance_threshold: 0.6
  min_margin: 0.0
  soft_semantic_fallback: false
  vector_read_mode: "new_only"
  vector_write_mode: "new_only"
  async_backfill: true
vectorDB:
  # 访问地址
  url: "http://lb-4u4r1fk4-1ys6gv3rpmdan420.clb.ap-guangzhou.tencentclb.com:60000"
  # 用户名
  username: "root"
  # 密码
  pwd: "YaUfVueWZJ20e4ghyLlBT8Dou5OapwpFTUq50oft"
  database: "ai-chat"
  # 请求超时时长s
  timeout: 5
  # 最大空闲连接数
  maxIdleConnPerHost: 2
  # 读一致性： strongConsistency(强一致性)，eventualConsistency(最终一致性)
  readConsistency: "eventualConsistency"
  # 空闲连接超时时长s
  idleConnTimeout: 60
