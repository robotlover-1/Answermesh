version: "3.8"
services:
  tokenizer:
    image: 192.168.239.161:5000/2404/tokenizer:1.0.0
    environment:
      PORT: 3002
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
    command: ["sh","-c","nuxt --port 3002 --module tokenizer.py --workers 2"]
  semantic:
    image: ${SEMANTIC_IMAGE:-192.168.233.128:5000/2404/semantic:1.0.0}
    environment:
      PORT: 3003
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
    command: ["sh","-c","nuxt --port 3003 --module semantic.py --workers 2"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3003/healthz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
  keywords:
    environment:
      AI_CHAT_KEYWORDS_ACCESS_TOKEN: "${AI_CHAT_KEYWORDS_ACCESS_TOKEN:-}"
    image: 192.168.239.161:5000/2404/keywords-filter:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:18082/readyz"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-keywords-conf
        target: /app/config.yaml
      - source: 2404-keywords-dict
        target: /app/dict.txt
  sensitive:
    environment:
      AI_CHAT_SENSITIVE_ACCESS_TOKEN: "${AI_CHAT_SENSITIVE_ACCESS_TOKEN:-}"
    image: 192.168.239.161:5000/2404/keywords-filter:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: ["./keywords-filter"]
    command: ["--config=config.yaml","--dict=dict.txt"]
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:18081/readyz"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-sensitive-conf
        target: /app/config.yaml
      - source: 2404-sensitive-dict
        target: /app/dict.txt
  ai-chat-service:
    environment:
      AI_CHAT_MYSQL_DSN: "${AI_CHAT_MYSQL_DSN:-}"
      AI_CHAT_SERVER_ACCESS_TOKEN: "${AI_CHAT_SERVER_ACCESS_TOKEN:-}"
      AI_CHAT_API_KEY: "${AI_CHAT_API_KEY:-}"
      AI_CHAT_REDIS_PWD: "${AI_CHAT_REDIS_PWD:-}"
      AI_CHAT_SENSITIVE_ACCESS_TOKEN: "${AI_CHAT_SENSITIVE_ACCESS_TOKEN:-}"
      AI_CHAT_KEYWORDS_ACCESS_TOKEN: "${AI_CHAT_KEYWORDS_ACCESS_TOKEN:-}"
    image: 192.168.239.161:5000/2404/ai-chat-service:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-service" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-ai-chat-service-conf
        target: /app/config.yaml
  ai-chat-backend:
    environment:
      AI_CHAT_MYSQL_DSN: "${AI_CHAT_MYSQL_DSN:-}"
      AI_CHAT_SERVER_ACCESS_TOKEN: "${AI_CHAT_SERVER_ACCESS_TOKEN:-}"
      AI_CHAT_REDIS_PWD: "${AI_CHAT_REDIS_PWD:-}"
    image: 192.168.239.161:5000/2404/ai-chat-backend:1.0.0
    ports:
      - "7080:80"
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-backend" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: [ "CMD","curl","http://localhost/api/health" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-ai-chat-backend-conf
        target: /app/config.yaml
configs:
  2404-keywords-conf:
    file: ./configs/keywords.yaml
  2404-keywords-dict:
    file: ./configs/keywords-dict.txt
  2404-sensitive-conf:
    file: ./configs/sensitive.yaml
  2404-sensitive-dict:
    file: ./configs/sensitive-dict.txt
  2404-ai-chat-service-conf:
    file: ./configs/ai-chat-service.yaml
  2404-ai-chat-backend-conf:
    file: ./configs/ai-chat-backend.yaml
