# AnswerMesh 全栈 Docker Compose（build-from-source）。
# 用法:  cd docker && docker compose up -d --build      （首次构建需联网: go/pnpm/模型/镜像源）
# 注意:
#  - MySQL 假定已可在宿主机 :3306 访问(compose 内用 host.docker.internal 连)，库 ai_chat 由 backend 启动自建 users 表；
#    root/123456 与 ai-chat-service/dev 一致，可用 MYSQL_HOST/MYSQL_PORT 另配(需自行改 docker/config/*.yaml 的 dsn)。
#  - DeepSeek key 走环境变量:  DEEPSEEK_API_KEY=sk-xxx docker compose up
#  - kvstore 镜像为“实验性”(见 kvstore.Dockerfile)。若构建失败: 在宿主 ./start.sh 只跑 kvstore(:5160)，
#    然后把下面 kvstore 服务注释掉，并把 docker/config/{service,backend}.yaml 的 redis host 由 "kvstore" 改 "host.docker.internal"。
#  - 本套配置未在本仓库开发机验证(无 docker daemon)，首次请在 docker 主机按报错微调。
#  - 安全：7080 仅绑宿主机回环(127.0.0.1:7080:7080)，proxy 不暴露宿主端口；
#    公网入口走 deploy/edge 的 Nginx→frps→frpc→127.0.0.1:7080。
#  - docker compose 前必须先运行 ../deploy/scripts/render-config.sh app（生成 docker/config/*.yaml）。
name: answermesh

x-go-common: &go-common
  build:
    context: ..
    dockerfile: docker/golang.Dockerfile
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  kvstore:
    build:
      context: ..
      dockerfile: docker/kvstore.Dockerfile
    restart: unless-stopped
    volumes:
      - ../configs/kvstore-ai.conf:/configs/kvstore-ai.conf:ro
    # 数据/日志目录见 kvstore-ai.conf（容器内 CWD=/，需匹配其相对路径；建议再挂一个卷）
    # volumes:
    #   - kvstore-data:/data
    command: ["sh","-c","./kvstore/kvstore/kvstore configs/kvstore-ai.conf"]

  tokenizer:
    build: ../tokenizer
    restart: unless-stopped
    environment:
      PORT: "3002"

  semantic:
    build: ../semantic
    restart: unless-stopped
    environment:
      PORT: "3003"
      SEMANTIC_INTRA_OP: "4"
      SEMANTIC_INTER_OP: "1"

  sensitive:
    environment:
      AI_CHAT_SENSITIVE_ACCESS_TOKEN: "${AI_CHAT_SENSITIVE_ACCESS_TOKEN:-}"
    <<: *go-common
    build:
      context: ..
      dockerfile: docker/golang.Dockerfile
      args:
        SRV: keywords-filter/filter-server
        ENTRY: .
    volumes:
      - ../keywords-filter/dev.config.yaml:/app/config.yaml:ro
      - ../keywords-filter/dict.txt:/app/dict.txt:ro
    command: ["./app","--config=config.yaml","--dict=dict.txt"]

  keyword:
    environment:
      AI_CHAT_KEYWORDS_ACCESS_TOKEN: "${AI_CHAT_KEYWORDS_ACCESS_TOKEN:-}"
    <<: *go-common
    build:
      context: ..
      dockerfile: docker/golang.Dockerfile
      args:
        SRV: keywords-filter/filter-server
        ENTRY: .
    volumes:
      - ../keywords-filter/dev.kw.config.yaml:/app/config.yaml:ro
      - ../keywords-filter/keyword-dict.txt:/app/dict.txt:ro
    command: ["./app","--config=config.yaml","--dict=dict.txt"]

  mock:
    <<: *go-common
    build:
      context: ..
      dockerfile: docker/golang.Dockerfile
      args:
        SRV: mock-openai-api
        ENTRY: .
    volumes:
      - ../mock-openai-api/dev.config.yaml:/app/config.yaml:ro
    command: ["./app","--config=config.yaml"]

  proxy:
    environment:
      OPENAI_PROXY_ACCESS_TOKEN: "${OPENAI_PROXY_ACCESS_TOKEN:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    <<: *go-common
    build:
      context: ..
      dockerfile: docker/golang.Dockerfile
      args:
        SRV: openai-api-proxy
        ENTRY: .
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    volumes:
      - ../openai-api-proxy/dev.config.yaml:/app/config.yaml:ro
    command: ["./app","--config=config.yaml"]

  ai-chat-service:
    environment:
      AI_CHAT_MYSQL_DSN: "${AI_CHAT_MYSQL_DSN:-}"
      AI_CHAT_SERVER_ACCESS_TOKEN: "${AI_CHAT_SERVER_ACCESS_TOKEN:-}"
      AI_CHAT_API_KEY: "${AI_CHAT_API_KEY:-}"
      AI_CHAT_REDIS_PWD: "${AI_CHAT_REDIS_PWD:-}"
      AI_CHAT_SENSITIVE_ACCESS_TOKEN: "${AI_CHAT_SENSITIVE_ACCESS_TOKEN:-}"
      AI_CHAT_KEYWORDS_ACCESS_TOKEN: "${AI_CHAT_KEYWORDS_ACCESS_TOKEN:-}"
    <<: *go-common
    build:
      context: ..
      dockerfile: docker/golang.Dockerfile
      args:
        SRV: ai-chat-service
        ENTRY: ./chat-server
    volumes:
      - ./config/service.yaml:/app/config.yaml:ro
    command: ["./app","--config=config.yaml"]
    depends_on:
      - kvstore
      - tokenizer
      - semantic
      - sensitive
      - keyword
      - proxy

  ai-chat-backend:
    environment:
      AI_CHAT_MYSQL_DSN: "${AI_CHAT_MYSQL_DSN:-}"
      AI_CHAT_SERVER_ACCESS_TOKEN: "${AI_CHAT_SERVER_ACCESS_TOKEN:-}"
      AI_CHAT_REDIS_PWD: "${AI_CHAT_REDIS_PWD:-}"
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    volumes:
      - ./config/backend.yaml:/app/config.yaml:ro
    command: ["./app","--config=config.yaml"]
    depends_on:
      - ai-chat-service
      - tokenizer
    ports:
      - "127.0.0.1:7080:7080"

